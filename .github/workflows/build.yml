name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mv_to() { if [ -f "$1" ]; then mkdir -p "$(dirname "$2")"; mv "$1" "$2"; fi; }
          mv_to MainActivity.kt app/src/main/java/com/unwind/launcher/MainActivity.kt
          mv_to AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv_to app-build.gradle.kts app/build.gradle.kts
          mv_to strings.xml app/src/main/res/values/strings.xml
          mv_to themes.xml app/src/main/res/values/themes.xml
          mv_to ic_banner.xml app/src/main/res/drawable/ic_banner.xml
          mv_to wallpaper.jpg app/src/main/res/drawable-nodpi/wallpaper.jpg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: unwind-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
