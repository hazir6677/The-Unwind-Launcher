name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the build attach the APK to a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $V in app/build.gradle.kts"
            exit 1
          fi
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.UNWIND_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/unwind.jks"
            echo "UNWIND_KEYSTORE_PATH=$RUNNER_TEMP/unwind.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret found. This APK will NOT install over an older one."
          fi
      - name: Build debug APK
        run: gradle assembleGithubDebug --no-daemon
        env:
          UNWIND_KEYSTORE_PASSWORD: ${{ secrets.UNWIND_KEYSTORE_PASSWORD }}
          UNWIND_KEY_ALIAS: ${{ secrets.UNWIND_KEY_ALIAS }}
          UNWIND_KEY_PASSWORD: ${{ secrets.UNWIND_KEY_PASSWORD }}
      - name: Build release APK (smoother)
        run: gradle assembleGithubRelease --no-daemon
        continue-on-error: true
        env:
          UNWIND_KEYSTORE_PASSWORD: ${{ secrets.UNWIND_KEYSTORE_PASSWORD }}
          UNWIND_KEY_ALIAS: ${{ secrets.UNWIND_KEY_ALIAS }}
          UNWIND_KEY_PASSWORD: ${{ secrets.UNWIND_KEY_PASSWORD }}
      - name: Check that the F-Droid version builds too
        run: gradle assembleFdroidRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: unwind-launcher-apk
          path: |
            app/build/outputs/apk/github/release/app-github-release.apk
            app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: warn
      - name: Prepare the release file
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/github/release/app-github-release.apk ]; then
            cp app/build/outputs/apk/github/release/app-github-release.apk "dist/Unwind-${GITHUB_REF_NAME}.apk"
          else
            cp app/build/outputs/apk/github/debug/app-github-debug.apk "dist/Unwind-${GITHUB_REF_NAME}.apk"
          fi
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '/^## /{ if (on) exit; t=$0; sub(/^## v?/, "", t); on=(t==v); next } on' CHANGELOG.md > release_notes.md || true
          if [ ! -s release_notes.md ]; then echo "See CHANGELOG.md for what changed." > release_notes.md; fi
          cat release_notes.md
      - name: Attach the APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: release_notes.md
