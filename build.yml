name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          J=app/src/main/java/com/unwind/launcher
          R=app/src/main/res
          mkdir -p $J $R/values $R/drawable $R/drawable-nodpi
          for f in *.kt; do [ -f "$f" ] && mv "$f" $J/; done
          for f in *.jpg; do [ -f "$f" ] && mv "$f" $R/drawable-nodpi/; done
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f app-build.gradle.kts ] && mv app-build.gradle.kts app/build.gradle.kts
          [ -f strings.xml ] && mv strings.xml $R/values/
          [ -f themes.xml ] && mv themes.xml $R/values/
          [ -f ic_banner.xml ] && mv ic_banner.xml $R/drawable/
          ls -R app | head -60
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: unwind-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
